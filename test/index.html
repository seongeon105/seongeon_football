<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="성언 풋볼">
<meta name="theme-color" content="#050608">
<meta name="color-scheme" content="dark">   <!-- 사파리 위쪽 상태바 · 도구막대를 어두운 색으로 (밝은 테마면 흰색으로 나옴) -->   <!-- 사파리 맨 위 상태바(시계 · 배터리) 줄을 흰색 대신 게임 배경색으로 -->
<title>성언 풋볼</title>
<style>
/* 아이패드 사파리: 100vh 는 주소창 · 탭 막대 밑까지 포함돼서 화면 아래가 잘렸음 → 실제로 보이는 크기(visualViewport)에 캔버스를 맞춤 */
html{color-scheme:dark;background-color:#050608}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;outline:none;touch-action:none}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#fff;font:600 12px "Share Tech Mono",monospace;color:#FFA45C;letter-spacing:.4em}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#0A0B10;color:#F2F0EC;font:700 18px system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}
#rot b{font-size:44px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#bar{width:220px;height:4px;background:#eee;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#FF8A3D;transition:width .2s}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="rot"><b>⟳</b><div>가로로 돌려 주세요</div><div style="font-weight:400;font-size:14px;opacity:.7">성언 풋볼은 가로 화면에서 해요</div></div>
<div id="topshade" style="position:fixed;left:0;right:0;top:0;height:max(2px,env(safe-area-inset-top));background:#050608;z-index:8;pointer-events:none"></div>
<div id="ld"><div>LOADING</div><div id="bar"><i></i></div></div>
<script>
(function(){ var c=document.getElementById('c');
  function fit(){ var vv=window.visualViewport; var w=vv?vv.width:window.innerWidth, h=vv?vv.height:window.innerHeight; var top=vv?vv.offsetTop:0, left=vv?vv.offsetLeft:0;
    c.style.width=w+'px'; c.style.height=h+'px'; c.style.top=top+'px'; c.style.left=left+'px'; window.scrollTo(0,0); }
  fit(); window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){ setTimeout(fit,250); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize',fit); window.visualViewport.addEventListener('scroll',fit); }
  var coarse=window.matchMedia('(pointer: coarse)').matches;
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
  function immersive(){
    if(!coarse&&!standalone) return;
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(ios) return;   /* 아이패드 · 아이폰 사파리는 전체화면이면 왼쪽 위에 X 버튼이 꼭 생김 → 전체화면 요청 안 함 (홈 화면에 추가해서 열면 주소창 없이 꽉 참) */
    if(!standalone&&c.requestFullscreen){ var fs=c.requestFullscreen(); if(fs&&fs.catch) fs.catch(function(){}); }
    if(screen.orientation&&screen.orientation.lock){ var lock=screen.orientation.lock('landscape'); if(lock&&lock.catch) lock.catch(function(){}); }
  }
  c.addEventListener('pointerdown',immersive,{once:true});
  c.addEventListener('touchstart',immersive,{once:true,passive:true});
  document.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});   // 페이지가 통째로 끌려 움직이지 않게
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });               // 두 손가락 확대 막기
})();
</script>
<script src="Build/WebGL.loader.js?v=0.16.1"></script>
<script>
createUnityInstance(document.querySelector('#c'),{
  dataUrl:"Build/WebGL.data.unityweb?v=0.16.1",frameworkUrl:"Build/WebGL.framework.js.unityweb?v=0.16.1",codeUrl:"Build/WebGL.wasm.unityweb?v=0.16.1",
  streamingAssetsUrl:"StreamingAssets",companyName:"SEONGEON INTERACTIVE",productName:"성언 풋볼",productVersion:"0.16.1",
  devicePixelRatio:Math.min(2,window.devicePixelRatio||1)
},p=>{document.querySelector('#bar i').style.width=(p*100)+'%';}).then(inst=>{window.u=inst;document.querySelector('#ld').remove();document.querySelector('#c').focus();})
.catch(e=>{document.querySelector('#ld').textContent=String(e);});
</script>
</body>
</html>
